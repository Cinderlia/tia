profile: trigger
# Write whitelist: empty = only tables registered in case_open/case_note are writable (default strictest).
write_allow_tables: []
# These columns must never be written under any circumstances (passwords, tokens, etc.).
write_deny_columns:
  - password
  - passwd
  - secret
  - token
  - api_key
max_rows_per_write: 1
max_source_lines: 500
max_http_bytes: 32768
