[project]
name = "tia"
version = "0.1.0"
description = "Trace-based Injection Agent: prove sinks are reached and values are written by the app itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=0.0.30",
    "pydantic-graph>=0.0.30",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "lxml>=5.2",
    "pymysql>=1.1",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.scripts]
tia = "tia.cli:main"
tia-server = "tia.server:main"
tia-agent = "tia.agent_cli:main"
tia-report = "tia.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tia"]

[tool.uv]
python-preference = "only-system"

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
